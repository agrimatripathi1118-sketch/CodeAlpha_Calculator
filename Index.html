<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Glass Calculator - CodeAlpha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: 100%;
      max-width: 360px;
      border-radius: 25px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .display {
      background: rgba(0, 0, 0, 0.2);
      padding: 30px 20px;
      text-align: right;
      word-wrap: break-word;
      word-break: break-all;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .previous-op {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      min-height: 24px;
    }

    .current-op {
      color: #ffffff;
      font-size: 2.8rem;
      font-weight: 500;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 25px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      outline: none;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #ffffff;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn.action {
      background: rgba(255, 95, 86, 0.8);
      color: white;
    }

    .btn.action:hover {
      background: rgba(255, 95, 86, 1);
    }

    .btn.operator {
      background: rgba(79, 70, 229, 0.8);
      color: white;
    }

    .btn.operator:hover {
      background: rgba(79, 70, 229, 1);
    }

    .btn.equal {
      background: rgba(16, 185, 129, 0.9);
      color: white;
    }

    .btn.equal:hover {
      background: rgba(16, 185, 129, 1);
    }

    .span-two {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator-container">
    <div class="display">
      <div id="previous-op" class="previous-op"></div>
      <div id="current-op" class="current-op">0</div>
    </div>
    <div class="buttons">
      <button class="btn action" onclick="clearDisplay()">AC</button>
      <button class="btn action" onclick="deleteChar()">DEL</button>
      <button class="btn operator" onclick="appendOperator('%')">%</button>
      <button class="btn operator" onclick="appendOperator('/')">÷</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn operator" onclick="appendOperator('*')">×</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn operator" onclick="appendOperator('-')">-</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn operator" onclick="appendOperator('+')">+</button>

      <button class="btn" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendNumber('.')">.</button>
      <button class="btn equal span-two" onclick="compute()">=</button>
    </div>
  </div>

  <script>
    let currentOp = document.getElementById('current-op');
    let previousOp = document.getElementById('previous-op');
    let shouldResetDisplay = false;

    function appendNumber(number) {
      if (currentOp.innerText === '0' || shouldResetDisplay) {
        currentOp.innerText = '';
        shouldResetDisplay = false;
      }
      if (number === '.' && currentOp.innerText.includes('.')) return;
      currentOp.innerText += number;
    }

    function appendOperator(operator) {
      if (currentOp.innerText === '') return;
      if (previousOp.innerText !== '') {
        compute();
      }
      previousOp.innerText = `${currentOp.innerText} ${operator}`;
      shouldResetDisplay = true;
    }

    function clearDisplay() {
      currentOp.innerText = '0';
      previousOp.innerText = '';
    }

    function deleteChar() {
      if (shouldResetDisplay) return;
      currentOp.innerText = currentOp.innerText.slice(0, -1);
      if (currentOp.innerText === '') {
        currentOp.innerText = '0';
      }
    }

    function compute() {
      let computation;
      const prev = parseFloat(previousOp.innerText);
      const current = parseFloat(currentOp.innerText);
      const parts = previousOp.innerText.split(' ');
      const operator = parts[1];

      if (isNaN(prev) || isNaN(current)) return;

      switch (operator) {
        case '+':
          computation = prev + current;
          break;
        case '-':
          computation = prev - current;
          break;
        case '*':
          computation = prev * current;
          break;
        case '/':
          if (current === 0) {
            alert("Cannot divide by zero");
            return;
          }
          computation = prev / current;
          break;
        case '%':
          computation = prev % current;
          break;
        default:
          return;
      }

      currentOp.innerText = Math.round(computation * 10000) / 10000;
      previousOp.innerText = '';
      shouldResetDisplay = true;
    }

    // Keyboard Support
    window.addEventListener('keydown', (e) => {
      if ((e.key >= 0 && e.key <= 9) || e.key === '.') appendNumber(e.key);
      if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendOperator(e.key);
      if (e.key === 'Enter' || e.key === '=') compute();
      if (e.key === 'Backspace') deleteChar();
      if (e.key === 'Escape') clearDisplay();
    });
  </script>
</body>
</html>
