<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Scientific Calculator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 40%, #020617 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #f8fafc;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 24px;
      padding: 24px;
      flex: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-title p {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .controls-top {
      display: flex;
      gap: 8px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .btn-ctrl.active-sci {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }

    /* Screen Display */
    .display-screen {
      background: rgba(2, 6, 23, 0.8);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
      text-align: right;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .memory-tag {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 9px;
      font-weight: 700;
      color: #818cf8;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .prev-expr {
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
      margin-bottom: 4px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .curr-expr {
      color: #f8fafc;
      font-size: 28px;
      font-weight: 700;
      font-family: monospace;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Memory Bar */
    .memory-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-mem {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mem:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    /* Keypads */
    .keypad-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sci-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      transition: all 0.3s ease;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-btn {
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-btn:active {
      transform: scale(0.93);
    }

    .btn-num {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
    }
    .btn-num:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-op {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.25);
      color: #818cf8;
    }
    .btn-op:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
    }

    .btn-act {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.25);
      color: #f87171;
    }
    .btn-act:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-sci {
      background: rgba(147, 51, 234, 0.15);
      border-color: rgba(147, 51, 234, 0.25);
      color: #c084fc;
      font-size: 13px;
    }
    .btn-sci:hover {
      background: rgba(147, 51, 234, 0.25);
    }

    .btn-eq {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .btn-eq:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    /* History Panel */
    .history-panel {
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .history-panel {
        max-width: 100%;
        max-height: 250px;
      }
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .clear-hist {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
    }
    .clear-hist:hover {
      color: #f87171;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 340px;
      padding-right: 4px;
    }

    .history-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      text-align: right;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .history-expr {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .history-res {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      font-family: monospace;
    }

    .empty-msg {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      font-style: italic;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    
    <!-- CALCULATOR MAIN -->
    <div class="glass-panel">
      
      <!-- HEADER -->
      <div class="header">
        <div class="logo-area">
          <div class="logo-icon">
            🧮
          </div>
          <div class="logo-title">
            <h1>CALCULATOR</h1>
            <p>Pro Scientific Edition</p>
          </div>
        </div>

        <div class="controls-top">
          <button id="angleBtn" onclick="toggleAngleMode()" class="btn-ctrl">DEG</button>
          <button id="sciToggleBtn" onclick="toggleScientificMode()" class="btn-ctrl active-sci">🔬 Scientific</button>
        </div>
      </div>

      <!-- SCREEN -->
      <div class="display-screen">
        <div id="memoryIndicator" class="memory-tag">MEM ACTIVE</div>
        <div id="previousExpr" class="prev-expr"></div>
        <div id="currentDisplay" class="curr-expr">0</div>
      </div>

      <!-- MEMORY BUTTONS -->
      <div class="memory-bar">
        <button onclick="handleMemory('MC')" class="btn-mem">MC</button>
        <button onclick="handleMemory('MR')" class="btn-mem">MR</button>
        <button onclick="handleMemory('M+')" class="btn-mem">M+</button>
        <button onclick="handleMemory('M-')" class="btn-mem">M-</button>
      </div>

      <!-- KEYPADS -->
      <div class="keypad-container">
        
        <!-- SCIENTIFIC BUTTONS -->
        <div id="scientificGrid" class="sci-grid">
          <button onclick="appendFunction('sin')" class="calc-btn btn-sci">sin</button>
          <button onclick="appendFunction('cos')" class="calc-btn btn-sci">cos</button>
          <button onclick="appendFunction('tan')" class="calc-btn btn-sci">tan</button>
          <button onclick="appendFunction('log')" class="calc-btn btn-sci">log</button>
          <button onclick="appendFunction('ln')" class="calc-btn btn-sci">ln</button>
          
          <button onclick="appendFunction('sqrt')" class="calc-btn btn-sci">√</button>
          <button onclick="appendOperator('^')" class="calc-btn btn-sci">xⁿ</button>
          <button onclick="appendValue('π')" class="calc-btn btn-sci">π</button>
          <button onclick="appendValue('e')" class="calc-btn btn-sci">e</button>
          <button onclick="appendFunction('fact')" class="calc-btn btn-sci">x!</button>
        </div>

        <!-- STANDARD BUTTONS -->
        <div class="main-grid">
          <button onclick="clearAll()" class="calc-btn btn-act">AC</button>
          <button onclick="deleteLast()" class="calc-btn btn-act">⌫</button>
          <button onclick="appendOperator('%')" class="calc-btn btn-op">%</button>
          <button onclick="appendOperator('/')" class="calc-btn btn-op">÷</button>

          <button onclick="appendValue('7')" class="calc-btn btn-num">7</button>
          <button onclick="appendValue('8')" class="calc-btn btn-num">8</button>
          <button onclick="appendValue('9')" class="calc-btn btn-num">9</button>
          <button onclick="appendOperator('*')" class="calc-btn btn-op">×</button>

          <button onclick="appendValue('4')" class="calc-btn btn-num">4</button>
          <button onclick="appendValue('5')" class="calc-btn btn-num">5</button>
          <button onclick="appendValue('6')" class="calc-btn btn-num">6</button>
          <button onclick="appendOperator('-')" class="calc-btn btn-op">−</button>

          <button onclick="appendValue('1')" class="calc-btn btn-num">1</button>
          <button onclick="appendValue('2')" class="calc-btn btn-num">2</button>
          <button onclick="appendValue('3')" class="calc-btn btn-num">3</button>
          <button onclick="appendOperator('+')" class="calc-btn btn-op">+</button>

          <button onclick="toggleSign()" class="calc-btn btn-num">±</button>
          <button onclick="appendValue('0')" class="calc-btn btn-num">0</button>
          <button onclick="appendValue('.')" class="calc-btn btn-num">.</button>
          <button onclick="calculateResult()" class="calc-btn btn-eq">=</button>
        </div>

      </div>

    </div>

    <!-- HISTORY PANEL -->
    <div class="glass-panel history-panel">
      <div>
        <div class="history-header">
          <span>📜 History</span>
          <button onclick="clearHistory()" class="clear-hist">Clear</button>
        </div>
        <div id="historyList" class="history-list">
          <p id="emptyHistoryMsg" class="empty-msg">कोई हिस्ट्री नहीं है</p>
        </div>
      </div>
      <div style="font-size: 10px; color: #64748b; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; margin-top: 10px;">
        Keyboard supported
      </div>
    </div>

  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let memoryValue = 0;
    let isRadMode = false;
    let isSciModeVisible = true;
    let isCalculated = false;

    const currentDisplay = document.getElementById('currentDisplay');
    const previousExpr = document.getElementById('previousExpr');
    const memoryIndicator = document.getElementById('memoryIndicator');
    const angleBtn = document.getElementById('angleBtn');
    const sciToggleBtn = document.getElementById('sciToggleBtn');
    const scientificGrid = document.getElementById('scientificGrid');
    const historyList = document.getElementById('historyList');
    const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');

    function updateDisplay() {
      currentDisplay.innerText = currentInput;
      previousExpr.innerText = previousInput;
    }

    function appendValue(val) {
      if (isCalculated) {
        currentInput = (val === '.' ? '0.' : val);
        isCalculated = false;
      } else {
        if (currentInput === '0' && val !== '.') {
          currentInput = val;
        } else {
          if (val === '.' && currentInput.includes('.')) return;
          currentInput += val;
        }
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (isCalculated) isCalculated = false;
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%', '^'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function appendFunction(fn) {
      if (isCalculated) isCalculated = false;
      if (currentInput === '0') {
        currentInput = fn + '(';
      } else {
        currentInput += fn + '(';
      }
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      isCalculated = false;
      updateDisplay();
    }

    function deleteLast() {
      if (isCalculated) {
        clearAll();
        return;
      }
      if (currentInput.length === 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0') return;
      if (currentInput.startsWith('-')) {
        currentInput = currentInput.substring(1);
      } else {
        currentInput = '-' + currentInput;
      }
      updateDisplay();
    }

    function toggleAngleMode() {
      isRadMode = !isRadMode;
      angleBtn.innerText = isRadMode ? 'RAD' : 'DEG';
      angleBtn.style.color = isRadMode ? '#c084fc' : '#cbd5e1';
    }

    function toggleScientificMode() {
      isSciModeVisible = !isSciModeVisible;
      if (isSciModeVisible) {
        scientificGrid.style.display = 'grid';
        sciToggleBtn.classList.add('active-sci');
      } else {
        scientificGrid.style.display = 'none';
        sciToggleBtn.classList.remove('active-sci');
      }
    }

    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    function calculateResult() {
      try {
        let expr = currentInput;
        previousInput = expr + ' =';

        expr = expr.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');
        expr = expr.replace(/\^/g, '**');

        expr = expr.replace(/sin\(([^)]+)\)/g, (match, p1) => {
          let val = eval(p1);
          return `Math.sin(${isRadMode ? val : val * Math.PI / 180})`;
        });
        expr = expr.replace(/cos\(([^)]+)\)/g, (match, p1) => {
          let val = eval(p1);
          return `Math.cos(${isRadMode ? val : val * Math.PI / 180})`;
        });
        expr = expr.replace(/tan\(([^)]+)\)/g, (match, p1) => {
          let val = eval(p1);
          return `Math.tan(${isRadMode ? val : val * Math.PI / 180})`;
        });
        
        expr = expr.replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)');
        expr = expr.replace(/log\(([^)]+)\)/g, 'Math.log10($1)');
        expr = expr.replace(/ln\(([^)]+)\)/g, 'Math.log($1)');
        expr = expr.replace(/fact\(([^)]+)\)/g, (match, p1) => `factorial(${eval(p1)})`);

        let result = eval(expr);

        if (typeof result === 'number' && !Number.isInteger(result)) {
          result = parseFloat(result.toFixed(8));
        }

        addToHistory(currentInput, result);
        currentInput = String(result);
        isCalculated = true;

      } catch (err) {
        currentInput = 'Error';
        isCalculated = true;
      }
      updateDisplay();
    }

    function handleMemory(action) {
      const currentNum = parseFloat(currentInput) || 0;
      if (action === 'MC') {
        memoryValue = 0;
        memoryIndicator.style.opacity = '0';
      } else if (action === 'MR') {
        currentInput = String(memoryValue);
        updateDisplay();
      } else if (action === 'M+') {
        memoryValue += currentNum;
        memoryIndicator.style.opacity = '1';
      } else if (action === 'M-') {
        memoryValue -= currentNum;
        memoryIndicator.style.opacity = memoryValue !== 0 ? '1' : '0';
      }
    }

    function addToHistory(expr, result) {
      if (emptyHistoryMsg) emptyHistoryMsg.style.display = 'none';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-expr">${expr}</div>
        <div class="history-res">= ${result}</div>
      `;
      item.onclick = () => {
        currentInput = String(result);
        isCalculated = false;
        updateDisplay();
      };

      historyList.prepend(item);
    }

    function clearHistory() {
      historyList.innerHTML = '<p id="emptyHistoryMsg" class="empty-msg">कोई हिस्ट्री नहीं है</p>';
    }

    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendValue(e.key);
      if (['+', '-', '*', '/', '%'].includes(e.key)) appendOperator(e.key);
      if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculateResult();
      }
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
